# Sens des colonnes cliniques, recopié à la main depuis le dictionnaire officiel
# (donnees/acc-dictionnaire-final.xls). On le recopie ici parce que lire un .xls
# demanderait une bibliothèque de plus (xlrd).
#
# Le dictionnaire officiel ne donne pas les noms anglais des colonnes : le lien
# entre une colonne et une rubrique du dictionnaire est NOTRE lecture.
# "correspondance" dit à quel point on en est sûrs : "certaine", "probable" ou "absente".
# Une erreur ici trompe l'agent à chaque question : relire avant de modifier.

[Patient_ID]
sens = "Identifiant anonyme du patient."
correspondance = "absente"

[Chip_Type]
sens = "Type de puce utilisée pour le dosage : ISAC_V1, ISAC_V2 ou ALEX. Les puces ne mesurent pas toutes les mêmes allergènes."
correspondance = "probable"
rubrique = "Puce réalisée"

[Age]
sens = "Âge du patient, en années. Absent du dictionnaire officiel."
correspondance = "absente"

[Gender]
sens = "Sexe du patient."
correspondance = "certaine"
rubrique = "Sexe"
codes = { "1" = "Masculin", "0" = "Féminin" }

[Blood_Month_sample]
sens = "Mois du prélèvement sanguin, de 1 à 12. Ce n'est pas le mois des symptômes, et l'année n'est pas donnée."
correspondance = "certaine"
rubrique = "Mois du prélèvement"

[French_Residence_Department]
sens = "Département de résidence, anonymisé (deptA, deptB…) : impossible de savoir de quel vrai département il s'agit."
correspondance = "certaine"
rubrique = "Département de résidence"
codes = { "999" = "Non renseigné" }
manquant = "999"

[French_Region]
sens = "Région de résidence, anonymisée (regionA, regionB…) : impossible de savoir de quelle vraie région il s'agit."
correspondance = "certaine"
rubrique = "Région de France"

[Rural_or_urban_area]
sens = "Type d'habitat."
correspondance = "certaine"
rubrique = "Type d'habitat"
codes = { "9" = "Non renseigné", "0" = "Rural", "1" = "Urbain" }
manquant = "9"

[Sensitization]
sens = "Absent du dictionnaire officiel. Vaut 0 ou 1 ; le sens exact reste à confirmer."
correspondance = "absente"

[Treatment_of_rhinitis]
sens = "Traitement de la rhinite. Une cellule peut contenir plusieurs codes séparés par une virgule (ex. « 1,3 »)."
correspondance = "probable"
rubrique = "Traitement rhinite"
codes = { "9" = "Non renseigné", "0" = "Aucun", "1" = "Anti-H1, voie locale", "2" = "Anti-H1 voie générale", "3" = "Anti-H1 + CS voie locale", "4" = "CS voie générale" }
manquant = "9"

[Treatment_of_athsma]
sens = "Traitement de l'asthme (classification GINA). Une cellule peut contenir plusieurs codes séparés par une virgule."
correspondance = "probable"
rubrique = "Traitement (New) GINA"
codes = { "9" = "Non renseigné", "0" = "Aucun", "1" = "SABA à la demande", "2" = "ICS faible dose", "3" = "ICS/LABA faible dose", "4" = "ICS/LABA moyenne/forte dose", "5" = "ICS/LABA forte dose ou ICS long cours", "6" = "Biothérapie anti-IL5/IL5R", "7" = "Biothérapie anti-IL4/13R", "8" = "Non répondeur biothérapie", "10" = "LTRA +/- low dose ICS" }
manquant = "9"

[Age_of_onsets]
sens = "Âge d'apparition de l'anaphylaxie alimentaire (AA). Une cellule peut contenir plusieurs codes."
correspondance = "probable"
rubrique = "Age d'apparition AA"
codes = { "9" = "Non renseigné", "0" = "Pas d'AA", "1" = "Avant 6 mois", "2" = "Entre 6 mois et 2 ans", "3" = "Entre 2 et 3 ans", "4" = "Entre 3 et 10 ans", "5" = "Entre 10 et 20 ans", "6" = "Après 20 ans" }
manquant = "9"

[Skin_Symptoms]
sens = "Symptômes cutanés (peau, urticaire)."
correspondance = "probable"
rubrique = "Peau/urticaire"
codes = { "9" = "Sans objet", "0" = "Non", "1" = "Oui" }
manquant = "9"

[General_cofactors]
sens = "Cofacteurs généraux. Une cellule peut contenir plusieurs codes. Aucune cellule ne vaut 9 : on ne sait pas distinguer « aucun » de « non renseigné »."
correspondance = "probable"
rubrique = "COFACTEURS généraux"
codes = { "9" = "Non renseigné", "0" = "Aucun connu", "1" = "Effort/Activité sportive", "2" = "AINS", "3" = "Alcool", "4" = "Moisissures (maison insalubre)", "5" = "Acariens", "6" = "Animaux de compagnie : chat", "7" = "Animaux de compagnie : chien", "8" = "Animaux de compagnie : cheval", "10" = "Animaux de compagnie : rongeur", "11" = "Mucoviscidose", "12" = "IPP" }
manquant = "9"

[Treatment_of_atopic_dematitis]
sens = "Traitement actuel de la dermatite atopique. Une cellule peut contenir plusieurs codes."
correspondance = "probable"
rubrique = "Traitement actuel DA"
codes = { "9" = "Non renseigné", "0" = "Pas de traitement", "1" = "Emollients", "2" = "Dermocorticoïdes", "3" = "Protopic", "4" = "Ciclosporine voie générale", "5" = "Dupilumab", "6" = "Upadacitinib", "7" = "Baricitinib" }
manquant = "9"
